name: Nexus Build & Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-nexus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Execute Nexus system scan
        run: |
          python scripts/scan_nexus_system.py

      - name: Verify repository structure
        run: |
          echo "Starte Code-Analyse für Nexus-Core..."
          find . -type d -name "agent_storage" -o -name "scripts"
          find . \( -name "*.inc" -o -name "*.pwn" -o -name "*.pawn" \) | head
          echo "Strukturprüfung erfolgreich abgeschlossen."
